<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Tactics</title>
<meta name="description" content="A three-chapter medieval grid-tactics game in a single HTML file.">
<style>
:root{
  --bg:#14151b; --panel:#1e2028; --panel2:#282b36; --ink:#ece6d6; --muted:#a39c8a;
  --gold:#d9b25f; --gold2:#f3d98b; --blue:#4a7fe0; --red:#d24a4a; --line:#3a3d4a; --good:#5fbf6a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px}
#app{position:relative;width:min(100%,920px)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between;margin-bottom:10px}
h1{font:700 24px/1 Georgia,"Times New Roman",serif;letter-spacing:.05em;margin:0;color:var(--gold2)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
button:disabled{opacity:.4;cursor:default}
button.on{background:#5a2323;border-color:var(--red)}
button.primary{background:#6b5320;border-color:var(--gold);color:#fff3cf;font-weight:700}
button.pulse{animation:pulse 1.2s ease-in-out infinite;border-color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 4px #d9b25f66}}
kbd{font:600 11px ui-monospace,Consolas,monospace;background:#0e0f13;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
#main{display:flex;gap:12px;align-items:flex-start}
#boardWrap{position:relative;flex:0 0 auto;width:580px;max-width:100%;border:2px solid #4a4230;border-radius:4px;box-shadow:0 6px 24px #0009;line-height:0;background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
#panel{flex:1 1 300px;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-height:484px}
#menu{position:absolute;display:none;flex-direction:column;gap:3px;background:#101218f0;border:1px solid var(--gold);border-radius:6px;padding:5px;z-index:5;line-height:1.3;min-width:128px;box-shadow:0 4px 16px #000a}
#menu button{text-align:left;padding:6px 10px}
#menu button:focus{border-color:var(--gold2);background:#3a3322}
.layer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b0c10dd;border-radius:6px;padding:16px;z-index:10}
#dialog{z-index:20;background:#0b0c10aa}
.card{max-width:560px;width:100%;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:22px 24px;text-align:center;box-shadow:0 10px 40px #000c}
.card.small{max-width:380px}
.card h2{font:700 30px Georgia,serif;margin:4px 0 10px;color:var(--gold2)}
.card h2.big{font-size:44px;letter-spacing:.04em}
.card h2.lose{color:#ff9090}
.card p{margin:8px 0}
.card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.intro{font:italic 17px/1.5 Georgia,serif;color:#f0e8d0}
.left{text-align:left}
.card ul{text-align:left;margin:8px auto;padding-left:20px;display:inline-block}
.card table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;margin:6px 0}
.card td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.card h3{font:700 15px Georgia,serif;color:var(--gold);margin:14px 0 4px;text-align:left}
.sec{border-bottom:1px solid var(--line);padding:0 0 10px;margin:0 0 10px}
.sec:last-child{border-bottom:0;margin:0;padding:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.chap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lvname{font:700 19px Georgia,serif;margin:2px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#2b3d66;color:#cfe0ff}
.pill.enemy{background:#5a2323;color:#ffd0d0}
.pill.over,.pill.intro{background:#3a3a3a;color:#ddd}
.uname{font:700 17px Georgia,serif}
.cls{font:12px system-ui,sans-serif;color:var(--muted);margin-left:6px}
.stripe{padding-left:9px}
.stripe.player{border-left:3px solid var(--blue)}
.stripe.enemy{border-left:3px solid var(--red)}
.hp{display:flex;align-items:center;gap:8px;margin:6px 0;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:#0d0e12;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px 10px;font-size:13px;margin:6px 0}
.stats span{display:flex;justify-content:space-between;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
table.fc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.fc td{padding:3px 4px;text-align:center}
table.fc td.k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
table.fc tr.names td{font-weight:700;font-family:Georgia,serif;font-size:15px}
table.fc tr.wp td{font-size:12px;color:var(--muted)}
.p{color:#9cc0ff}.e{color:#ff9f9f}
.adv{color:#7be08a}.dis{color:#ff8080}
.hint{font-size:12px;color:var(--gold2);margin-top:8px;text-align:center}
.keys{font-size:12px;color:var(--muted);line-height:1.8}
footer{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
footer a{color:var(--gold)}
@media (max-width:900px){#main{flex-direction:column}#boardWrap{width:100%}#panel{width:100%;min-height:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Mini Tactics</h1>
    <div class="toolbar">
      <button id="btnDanger" title="Show every tile an enemy could attack next turn">Danger Zone <kbd>D</kbd></button>
      <button id="btnUndo" title="Undo your last action this turn">Undo <kbd>Z</kbd></button>
      <button id="btnEnd" title="End the player phase">End Turn <kbd>E</kbd></button>
      <button id="btnRestart" title="Restart this chapter">Restart</button>
      <button id="btnSound" title="Toggle sound effects">Sound: On</button>
      <button id="btnHelp" title="Controls and rules">Help</button>
    </div>
  </header>
  <div id="main">
    <div id="boardWrap">
      <canvas id="board" width="576" height="480" aria-label="Game board"></canvas>
      <div id="menu" role="menu"></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
  <footer>Mini Tactics · an original grid-tactics game in one HTML file · built with Claude Code · <a href="https://github.com/CharCharBean/mini-tactics">source on GitHub</a></footer>
  <div id="overlay" class="layer"></div>
  <div id="dialog" class="layer"></div>
</div>
<noscript><p style="text-align:center">Mini Tactics needs JavaScript to run.</p></noscript>
<script>
(() => {
'use strict';

// =====================================================================
// 1. CONSTANTS & DATA
// =====================================================================
const COLS = 12, ROWS = 10, TILE = 48, W = COLS * TILE, H = ROWS * TILE, N = COLS * ROWS;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const MOVE_STEP_MS = 85, ENEMY_PAUSE_MS = 400, BANNER_MS = 900;

const TERRAIN = {
  '.': { name: 'Plains',       cost: 1, avo: 0,  def: 0 },
  '=': { name: 'Bridge',       cost: 1, avo: 0,  def: 0 },
  '_': { name: 'Castle Floor', cost: 1, avo: 0,  def: 0 },
  'F': { name: 'Forest',       cost: 2, avo: 20, def: 1 },
  'M': { name: 'Mountain',     cost: 3, avo: 30, def: 1, note: 'Knights cannot enter.' },
  'T': { name: 'Fort',         cost: 2, avo: 20, def: 2, heal: true, note: 'Heals 20% max HP at the start of your phase.' },
  'G': { name: 'Gate',         cost: 2, avo: 20, def: 2, heal: true, note: 'Heals like a fort. Do not let an enemy end its turn here!' },
  'H': { name: 'Throne',       cost: 1, avo: 30, def: 3, heal: true, note: 'Heals like a fort. Aldric can Seize it.' },
  'W': { name: 'Wall',         cost: Infinity, avo: 0, def: 0, note: 'Impassable. Arrows and magic fly over.' },
  '~': { name: 'Water',        cost: Infinity, avo: 0, def: 0, note: 'Impassable. Arrows and magic fly over.' },
};

const WEAPONS = {
  oathblade:  { name: 'Oathblade',     type: 'sword', mt: 7,  hit: 95, crit: 10, min: 1, max: 1 },
  ironSword:  { name: 'Iron Sword',    type: 'sword', mt: 5,  hit: 90, crit: 0,  min: 1, max: 1 },
  steelSword: { name: 'Steel Sword',   type: 'sword', mt: 8,  hit: 75, crit: 0,  min: 1, max: 1 },
  ironLance:  { name: 'Iron Lance',    type: 'lance', mt: 7,  hit: 80, crit: 0,  min: 1, max: 1 },
  ironAxe:    { name: 'Iron Axe',      type: 'axe',   mt: 8,  hit: 75, crit: 0,  min: 1, max: 1 },
  warlordAxe: { name: "Warlord's Axe", type: 'axe',   mt: 12, hit: 70, crit: 5,  min: 1, max: 1 },
  ironBow:    { name: 'Iron Bow',      type: 'bow',   mt: 6,  hit: 85, crit: 0,  min: 2, max: 2 },
  fire:       { name: 'Fire',          type: 'tome',  mt: 5,  hit: 90, crit: 0,  min: 1, max: 2 },
};
const TYPE_LABEL = { sword: 'Sword', lance: 'Lance', axe: 'Axe', bow: 'Bow', tome: 'Tome' };

const PLAYER_BASE = [
  { id: 'aldric', name: 'Aldric', cls: 'Lord',   sprite: 'lord',   weapon: 'oathblade', hp: 20, str: 6, mag: 0, skl: 8, spd: 9, lck: 7, def: 5,  res: 2, mov: 5, lord: true },
  { id: 'brenna', name: 'Brenna', cls: 'Knight', sprite: 'knight', weapon: 'ironLance', hp: 24, str: 8, mag: 0, skl: 5, spd: 3, lck: 3, def: 11, res: 1, mov: 4 },
  { id: 'wren',   name: 'Wren',   cls: 'Archer', sprite: 'archer', weapon: 'ironBow',   hp: 18, str: 6, mag: 0, skl: 8, spd: 7, lck: 4, def: 4,  res: 1, mov: 5 },
  { id: 'maelis', name: 'Maelis', cls: 'Mage',   sprite: 'mage',   weapon: 'fire',      hp: 16, str: 0, mag: 7, skl: 6, spd: 7, lck: 5, def: 2,  res: 6, mov: 5 },
];
const DIGIT_TO_PLAYER = { 1: 'aldric', 2: 'brenna', 3: 'wren', 4: 'maelis' };

const ENEMY_CLASSES = {
  b: { cls: 'Brigand',   sprite: 'brigand',   weapon: 'ironAxe',   hp: 22, str: 7, mag: 0, skl: 3, spd: 3, lck: 0, def: 3, res: 0, mov: 5 },
  s: { cls: 'Soldier',   sprite: 'soldier',   weapon: 'ironLance', hp: 20, str: 6, mag: 0, skl: 4, spd: 4, lck: 1, def: 5, res: 0, mov: 5 },
  m: { cls: 'Mercenary', sprite: 'mercenary', weapon: 'ironSword', hp: 20, str: 6, mag: 0, skl: 7, spd: 8, lck: 2, def: 4, res: 0, mov: 5 },
  a: { cls: 'Archer',    sprite: 'archer',    weapon: 'ironBow',   hp: 18, str: 5, mag: 0, skl: 5, spd: 5, lck: 1, def: 3, res: 0, mov: 5 },
  g: { cls: 'Mage',      sprite: 'mage',      weapon: 'fire',      hp: 16, str: 0, mag: 5, skl: 4, spd: 5, lck: 1, def: 2, res: 4, mov: 5 },
  boss: { cls: 'Warlord', name: 'Garrick', sprite: 'boss', weapon: 'warlordAxe', hp: 34, str: 11, mag: 0, skl: 7, spd: 6, lck: 4, def: 9, res: 3, mov: 0, boss: true },
};

const LEVELS = [
  {
    name: 'Border Skirmish',
    intro: 'Brigands have crossed the border into Eastmarch. Drive them out.',
    objective: 'Defeat all enemies.',
    lose: 'Aldric falls.',
    tip: 'Swords beat axes, axes beat lances, lances beat swords. Choose Attack and hover an enemy to see the battle forecast before you commit.',
    goal: 'rout',
    map: [
      '..F.....FF..',
      '.FF..b....F.',
      '......M..s..',
      '.F...MM.....',
      '.....F..m.F.',
      '..T.....F...',
      '.F..F....a..',
      '12.....F....',
      '34..F...b...',
      '...F....FF..',
    ],
    behavior: cls => (cls === 'Soldier' || cls === 'Archer') ? 'guard' : 'aggressive',
  },
  {
    name: 'Hold the Bridge',
    intro: "The raiders' main force is coming for the Aldermoor bridge. Hold the gate until dawn.",
    objective: 'Survive 8 turns, or defeat every enemy.',
    lose: 'Aldric falls, or an enemy ends its turn on the gate.',
    tip: 'The whole raiding party can cross the bridge in a single turn. Press D to see every tile they can strike, and remember: an enemy cannot stop on the gate while one of your units is standing on it.',
    goal: 'defend',
    turns: 8,
    gate: { x: 0, y: 4 },
    map: [
      'F....~~....F',
      '.F...~~..M..',
      '..F..~~.s...',
      '.1...~~..a..',
      'G2.T.==..b..',
      '.3...==.s...',
      '.4F..~~...g.',
      '..F..~~.b...',
      '.F...~~..M..',
      'F....~~....F',
    ],
    behavior: () => 'aggressive',
    reinforcements: [
      { turn: 3, units: [{ k: 'b', x: 11, y: 2 }, { k: 'b', x: 11, y: 7 }] },
      { turn: 5, units: [{ k: 'm', x: 11, y: 4 }, { k: 'a', x: 11, y: 5 }] },
    ],
  },
  {
    name: 'Castle Seize',
    intro: 'Warlord Garrick holds Blackwater Keep. Take the throne and end this.',
    objective: 'Defeat Warlord Garrick, then move Aldric onto the throne and choose Seize.',
    lose: 'Aldric falls.',
    tip: "Garrick's armor shrugs off steel, but Maelis's Fire targets Resistance. Archers cover both doorways into the throne room.",
    goal: 'seize',
    throne: { x: 5, y: 1 },
    boss: { x: 5, y: 1 },
    map: [
      'WWWWWWWWWWWW',
      'W_a__H__g_aW',
      'W____s_____W',
      'WWW_WWWW_WWW',
      'W_m______b_W',
      'W__T____T__W',
      'WWWWW__WWWWW',
      '.F..b....F..',
      '..F.....s...',
      '..1234....F.',
    ],
    behavior: (cls, x, y) => y >= 7 ? 'aggressive' : 'guard',
  },
];

// =====================================================================
// 2. GAME STATE
// =====================================================================
const params = new URLSearchParams(location.search);
let SPEED = params.has('fast') ? 0 : 1;          // animation speed multiplier (0 = instant, for tests)
const FIXED_SEED = params.has('seed') ? (Number(params.get('seed')) >>> 0) : null;

const game = { roster: clone(PLAYER_BASE), log: [] };
let state = null;   // per-level state; see startLevel()
const ui = {
  mode: 'idle', sel: null, range: null, origin: null, preSnap: null,
  targets: [], fcTarget: null, pendingTarget: null,
  hover: null, danger: false, inspect: null, busy: false, actor: null,
  floats: [], banner: null, overlay: null,
};
let nextUid = 1;

function clone(o) { return JSON.parse(JSON.stringify(o)); }
const key = (x, y) => y * COLS + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const manhattan = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
const terr = (x, y) => TERRAIN[state.map[y][x]];
const living = team => state.units.filter(u => u.alive && (!team || u.team === team));
const unitAt = (x, y) => state.units.find(u => u.alive && u.x === x && u.y === y) || null;
const unitById = id => state.units.find(u => u.id === id) || null;
const L = () => LEVELS[state.li];

// =====================================================================
// 3. RNG (mulberry32, state lives in the level state so undo restores it)
// =====================================================================
function rngNext() {
  let t = (state.rng.s = (state.rng.s + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rngInt = n => Math.floor(rngNext() * n);

// True hit: average of two 0-99 rolls must be below the displayed hit.
function roll2RN(hit) { const a = rngInt(100), b = rngInt(100); return (a + b) / 2 < hit; }
function rollCrit(crit) { return rngInt(100) < crit; }
const TRUE_HIT = Array.from({ length: 101 }, (_, h) => {
  let n = 0;
  for (let a = 0; a < 100; a++) n += clamp(2 * h - a, 0, 100);   // count b with a + b < 2h
  return n / 10000;
});

// =====================================================================
// 4. COMBAT — the one place the formulas live. Forecast and battle share it.
// =====================================================================
function triangle(wa, wb) {
  const beats = { sword: 'axe', axe: 'lance', lance: 'sword' };
  if (beats[wa.type] === wb.type) return 1;
  if (beats[wb.type] === wa.type) return -1;
  return 0;
}
// a strikes d, with d standing on (dx, dy)
function combatStats(a, d, dx, dy) {
  const wa = WEAPONS[a.weapon], wd = WEAPONS[d.weapon];
  const tri = triangle(wa, wd), magic = wa.type === 'tome', t = TERRAIN[state.map[dy][dx]];
  const atk = (magic ? a.mag : a.str) + wa.mt + tri;
  const dmg = Math.max(0, atk - (magic ? d.res : d.def) - t.def);
  const hitRate = wa.hit + 2 * a.skl + Math.floor(a.lck / 2) + 15 * tri;
  const avoid = 2 * d.spd + d.lck + t.avo;
  const hit = clamp(hitRate - avoid);
  const crit = clamp(wa.crit + Math.floor(a.skl / 2) - d.lck);
  return { atk, dmg, hit, crit, tri };
}
function inRange(u, dist) { const w = WEAPONS[u.weapon]; return dist >= w.min && dist <= w.max; }

// Full exchange preview. The attacker may be standing on a hypothetical tile (ax, ay).
function forecast(att, def, ax = att.x, ay = att.y) {
  const dist = manhattan(ax, ay, def.x, def.y);
  const A = combatStats(att, def, def.x, def.y);
  const canCounter = inRange(def, dist);
  const D = combatStats(def, att, ax, ay);
  const aDoubles = att.spd >= def.spd + 4;
  const dDoubles = canCounter && def.spd >= att.spd + 4;
  const seq = ['a'];
  if (canCounter) seq.push('d');
  if (aDoubles) seq.push('a'); else if (dDoubles) seq.push('d');
  let ah = att.hp, dh = def.hp;
  for (const s of seq) {
    if (ah <= 0 || dh <= 0) break;
    if (s === 'a') dh = Math.max(0, dh - A.dmg); else ah = Math.max(0, ah - D.dmg);
  }
  return {
    attacker: att, defender: def, ax, ay, dist, seq,
    A: { ...A, count: aDoubles ? 2 : 1 },
    D: { ...D, canCounter, count: canCounter ? (dDoubles ? 2 : 1) : 0 },
    predicted: { att: ah, def: dh },
  };
}

// Plays the exchange with real rolls, mutating HP. Returns the strikes for animation.
function resolveCombat(fc) {
  const a = fc.attacker, d = fc.defender, strikes = [];
  for (const s of fc.seq) {
    if (a.hp <= 0 || d.hp <= 0) break;
    const [by, target, st] = s === 'a' ? [a, d, fc.A] : [d, a, fc.D];
    const hit = roll2RN(st.hit);
    const crit = hit && rollCrit(st.crit);
    const dmg = hit ? (crit ? st.dmg * 3 : st.dmg) : 0;
    const hpBefore = target.hp;
    target.hp = Math.max(0, target.hp - dmg);
    strikes.push({ by, target, hit, crit, dmg, hpBefore, hpAfter: target.hp });
  }
  for (const u of [a, d]) if (u.hp <= 0 && u.alive) { u.alive = false; u.fade = 1; }
  return strikes;
}

// =====================================================================
// 5. PATHING — one Dijkstra for player moves, enemy AI and danger zone
// =====================================================================
function moveCost(u, x, y) {
  const t = TERRAIN[state.map[y][x]];
  if (!isFinite(t.cost)) return Infinity;
  if (t === TERRAIN.M && u.cls === 'Knight') return Infinity;
  return t.cost;
}
function occupancy() {
  const occ = new Array(N).fill(null);
  for (const o of state.units) if (o.alive) occ[key(o.x, o.y)] = o;
  return occ;
}
function reachable(u, mov = u.mov) {
  const occ = occupancy();
  const cost = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), closed = new Uint8Array(N);
  const start = key(u.x, u.y);
  cost[start] = 0;
  const open = [start];
  while (open.length) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (cost[open[i]] < cost[open[bi]]) bi = i;
    const cur = open.splice(bi, 1)[0];
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cx = cur % COLS, cy = (cur / COLS) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (!inBounds(nx, ny)) continue;
      const nk = key(nx, ny), c = moveCost(u, nx, ny);
      if (!isFinite(c)) continue;
      const o = occ[nk];
      if (o && o.team !== u.team) continue;          // enemies of the mover block
      const nc = cost[cur] + c;
      if (nc <= mov && nc < cost[nk]) { cost[nk] = nc; prev[nk] = cur; open.push(nk); }
    }
  }
  const tiles = [];
  for (let k = 0; k < N; k++) {
    if (isFinite(cost[k]) && (!occ[k] || occ[k] === u)) tiles.push({ x: k % COLS, y: (k / COLS) | 0, cost: cost[k] });
  }

      tween(110, k => { by.off = { x: dx * (1 - k), y: dy * (1 - k) }; }),

}

// =====================================================================
// 10. ENEMY AI
// =====================================================================
const GATE_BONUS = 100;
function aiScore(fc, tile) {
  const A = fc.A, D = fc.D, target = fc.defender;
  let s = A.dmg * TRUE_HIT[A.hit] * A.count;                        // expected damage dealt
  if (A.dmg * A.count >= target.hp && A.hit >= 40) s += 50;         // can finish them
  if (target.lord) s += 20; else if (target.cls === 'Archer' || target.cls === 'Mage') s += 10;
  if (D.canCounter) s -= D.dmg * TRUE_HIT[D.hit] * D.count * 0.8;   // expected counter damage
  s += terr(tile.x, tile.y).avo * 0.1;                              // prefer cover (see Decisions)
  return s;
}
// Reverse Dijkstra from every player unit (and the gate on Level 2) using this enemy's move costs.
function distanceField(u) {
  const occ = occupancy(), D = new Array(N).fill(Infinity), src = new Uint8Array(N), closed = new Uint8Array(N), open = [];
  const addSrc = k => { if (!src[k]) { src[k] = 1; D[k] = 0; open.push(k); } };
  for (const p of living('player')) addSrc(key(p.x, p.y));
  if (L().gate) addSrc(key(L().gate.x, L().gate.y));
  while (open.length) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (D[open[i]] < D[open[bi]]) bi = i;
    const cur = open.splice(bi, 1)[0];
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cx = cur % COLS, cy = (cur / COLS) | 0;
    const enter = src[cur] ? 0 : moveCost(u, cx, cy);
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (!inBounds(nx, ny)) continue;
      const nk = key(nx, ny);
      if (src[nk] || !isFinite(moveCost(u, nx, ny))) continue;
      if (occ[nk] && occ[nk].team === 'player') continue;
      if (D[cur] + enter < D[nk]) { D[nk] = D[cur] + enter; open.push(nk); }
    }
  }

}

  for (const e of living('enemy')) {

    const zone = computeRange(e).attack;
    if (living('player').some(p => zone.has(key(p.x, p.y)))) e.triggered = true;
  }
}
async function enemyAct(e) {
  if (e.behavior === 'guard' && !e.triggered) return;
  const lv = L(), isBoss = e.behavior === 'boss';
  const reach = reachable(e, isBoss ? 0 : e.mov);
  let best = null;
  for (const t of reach.tiles) {
    for (const p of living('player')) {
      if (!inRange(e, manhattan(t.x, t.y, p.x, p.y))) continue;
      let s = aiScore(forecast(e, p, t.x, t.y), t);
      if (lv.gate && t.x === lv.gate.x && t.y === lv.gate.y) s += GATE_BONUS;
      if (!best || s > best.score) best = { score: s, tile: t, target: p };
    }
  }
  if (isBoss) { if (best) await doAttack(e, best.target); return; }
  if (lv.gate && reach.has(lv.gate.x, lv.gate.y) && (!best || best.score < GATE_BONUS)) {
    best = { score: GATE_BONUS, tile: lv.gate, target: null };
  }
  if (best && best.score > 0) {
    await animateMove(e, pathTo(reach, best.tile.x, best.tile.y));
    if (best.target) await doAttack(e, best.target);
    return;
  }
  // Fallback: advance toward the nearest player unit (or the gate).
  const D = distanceField(e);
  let bt = null;
  for (const t of reach.tiles) {
    const d = D[key(t.x, t.y)], avo = terr(t.x, t.y).avo;

async function runEnemyPhase() {

  state.phase = 'enemy';
  state.history = [];

  if (state !== S) return;

  const isRanged = u => ['bow', 'tome'].includes(WEAPONS[u.weapon].type);

  const order = [...enemies.filter(isRanged), ...enemies.filter(u => !isRanged(u))]

    .sort((a, b) => a.r - b.r || a.d - b.d).map(o => o.u);
  for (const e of order) {

    ui.actor = e;

  }
  const wave = (lv.reinforcements || []).find(w => w.turn === state.turn);
  if (wave) {

      const e = makeEnemy(r.k, r.x, r.y, state.li, 'aggressive');
      state.units.push(e);
      addFloat(r.x, r.y, 'Reinforcement!', '#ff9f9f');
    }
    state.spawned++;
    await banner('Reinforcements!', '#ffb070');
    if (state !== S) return;
  }
  state.turn++;
  ui.busy = false;
  if (lv.turns && state.turn > lv.turns) { victory('Dawn breaks over Aldermoor. The bridge held!'); return; }
  if (checkEnd()) return;
  await startPlayerPhase();
}

// 16. RENDERING — terrain and units are drawn procedurally as pixel art
// =====================================================================
const SKIN = '#f0c090', METAL = '#c3ccd6', STEEL = '#e6ecf2', WOOD = '#8a5a2b', GOLD = '#f0c43c', INK = '#1b1b22';

function hash(x, y, s = 0) {

    r(3, 4, 2, 6, WOOD); r(3, 3, 1, 1, '#ffffff'); r(4, 3, 1, 1, '#dddddd');               // quiver
    humanoid(r, p);
    r(6, 1, 5, 2, '#6b3f1d'); r(6, 2, 5, 1, p.light);                                       // hair + band
    r(12, 2, 1, 1, WOOD); r(13, 3, 1, 2, WOOD); r(14, 5, 1, 4, WOOD); r(13, 9, 1, 2, WOOD); r(12, 11, 1, 1, WOOD);
    r(12.67, 3, 0.34, 8, '#f4f4f4');                                                        // bowstring
  },
  mage(r, p, u, px, py, grey, now) {
    r(5, 6, 7, 4, p.main); r(4, 10, 9, 4, p.main); r(4, 13, 9, 1, p.light);
    r(12, 7, 1, 3, p.main); r(12, 10, 1, 1, SKIN);
    r(7, 0, 3, 1, p.main); r(6, 1, 5, 1, p.main); r(5, 2, 7, 4, p.main);
    r(7, 3, 3, 3, SKIN); r(7, 3, 3, 1, '#b98a60'); r(9, 4, 1, 1, INK);
    r(14, 3, 1, 11, WOOD);
    if (!grey) {
      const g = ctx.createRadialGradient(px + 43.5, py + 4.5, 1, px + 43.5, py + 4.5, 9 + Math.sin(now / 250) * 2);
      g.addColorStop(0, 'rgba(255,200,90,0.9)'); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g; ctx.fillRect(px + 32, py - 6, 24, 22);
    }
    r(13, 0, 3, 3, '#ffcf6a'); r(14, 1, 1, 1, '#fff6d0');
  },
  brigand(r, p) {
    r(6, 11, 2, 3, p.dark); r(9, 11, 2, 3, p.dark);
    r(5, 6, 7, 5, SKIN); r(5, 6, 2, 5, p.main); r(10, 6, 2, 5, p.main); r(5, 9, 7, 1, '#5a3a1a');
    r(4, 6, 1, 5, SKIN); r(12, 6, 1, 5, SKIN);
    r(6, 2, 5, 4, SKIN); r(9, 3, 1, 1, INK); r(7, 5, 4, 1, '#5a3a1a');
    r(6, 1, 5, 2, '#6e6a64');
    r(4, 0, 2, 1, '#efe6c8'); r(5, 1, 1, 1, '#efe6c8'); r(11, 0, 2, 1, '#efe6c8'); r(11, 1, 1, 1, '#efe6c8');  // horns
    r(13, 2, 1, 11, WOOD); r(14, 2, 2, 4, STEEL); r(11, 3, 2, 2, STEEL);                   // axe
  },
  soldier(r, p) {
    humanoid(r, p);
    r(6, 6, 5, 3, p.light);
    r(5, 2, 7, 1, METAL); r(6, 1, 5, 1, METAL);                                             // kettle helm
    r(13, 2, 1, 12, WOOD); r(13, 0, 1, 1, STEEL); r(12, 1, 3, 1, STEEL);                   // spear
  },
  mercenary(r, p) {
    humanoid(r, p);
    r(6, 6, 1, 1, '#5a3a1a'); r(7, 7, 1, 1, '#5a3a1a'); r(8, 8, 1, 1, '#5a3a1a'); r(9, 9, 1, 1, '#5a3a1a');
    r(6, 1, 5, 2, '#2a1d12'); r(6, 2, 5, 1, p.light); r(11, 2, 2, 1, p.light); r(12, 3, 1, 1, p.light);  // headband
    r(13, 2, 1, 7, STEEL); r(12, 9, 3, 1, '#8a8a8a'); r(13, 10, 1, 1, WOOD);              // sword
  },
  boss(r, p) {
    r(5, 11, 3, 3, p.dark); r(9, 11, 3, 3, p.dark);
    r(4, 6, 9, 5, '#3d3b44'); r(6, 6, 5, 3, p.main); r(4, 9, 9, 1, GOLD);
    r(3, 5, 3, 2, '#5c5a64'); r(11, 5, 3, 2, '#5c5a64'); r(3, 4, 1, 1, '#5c5a64'); r(13, 4, 1, 1, '#5c5a64');
    r(6, 3, 5, 3, SKIN); r(9, 4, 1, 1, INK); r(6, 5, 5, 1, '#3a2a1a');
    r(6, 2, 5, 1, '#4a4a50');
    r(4, 2, 2, 1, '#efe6c8'); r(4, 1, 1, 1, '#efe6c8'); r(11, 2, 2, 1, '#efe6c8'); r(12, 1, 1, 1, '#efe6c8');
    r(6, 1, 5, 1, GOLD); r(6, 0, 1, 1, GOLD); r(8, 0, 1, 1, GOLD); r(10, 0, 1, 1, GOLD);   // crown
    r(14, 1, 1, 13, WOOD); r(12, 1, 2, 5, STEEL); r(15, 1, 1, 5, STEEL);                   // great axe
  },
};
function unitPos(u) {
  const base = u.anim || { x: u.x * TILE, y: u.y * TILE };
  return { x: base.x + (u.off ? u.off.x : 0), y: base.y + (u.off ? u.off.y : 0) };
}
function drawUnit(u, now) {
  const { x: px, y: py } = unitPos(u);
  const grey = u.team === 'player' && u.acted && state.phase === 'player';
  ctx.globalAlpha = u.alive ? 1 : Math.max(0, u.fade);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(px + 25, py + 41, 13, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  const bob = !grey && u.team === 'player' && state.phase === 'player' && Math.floor(now / 500 + u.uid) % 2 ? -1 : 0;
  SPRITES[u.sprite](pix(px, py + bob, grey), TEAM[u.team], u, px, py + bob, grey, now);
  if (u.flash && now - u.flash < 140) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(px + 6, py, 36, 42); }
  // HP bar
  const ratio = clamp(u.dispHp / u.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(px + 5, py + 43, 38, 5);
  ctx.fillStyle = ratio > 0.5 ? '#6fd67a' : ratio > 0.25 ? '#f0c43c' : '#ef5a4a';
  ctx.fillRect(px + 6, py + 44, Math.round(36 * ratio), 3);
  ctx.globalAlpha = 1;
}

// ---- overlays ----
const HATCH = (() => {                       // diagonal stripes so the danger zone reads differently from a unit's range
  const c = document.createElement('canvas'); c.width = c.height = 12;
  const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,70,90,0.55)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-3, 15); g.lineTo(15, -3); g.moveTo(9, 15); g.lineTo(15, 9); g.moveTo(-3, 3); g.lineTo(3, -3); g.stroke();
  return c.getContext('2d').createPattern(c, 'repeat');
})();
function tint(k, color) {
  ctx.fillStyle = color;
  ctx.fillRect((k % COLS) * TILE + 1, ((k / COLS) | 0) * TILE + 1, TILE - 2, TILE - 2);
}
function outline(set, color) {
  ctx.fillStyle = color;
  for (const k of set) {
    const x = k % COLS, y = (k / COLS) | 0, px = x * TILE, py = y * TILE;
    if (!set.has(key(x, y - 1)) || y === 0) ctx.fillRect(px, py, TILE, 2);
    if (!set.has(key(x, y + 1)) || y === ROWS - 1) ctx.fillRect(px, py + TILE - 2, TILE, 2);
    if (x === 0 || !set.has(k - 1)) ctx.fillRect(px, py, 2, TILE);
    if (x === COLS - 1 || !set.has(k + 1)) ctx.fillRect(px + TILE - 2, py, 2, TILE);
  }
}
function brackets(x, y, color, pulse) {
  const px = x * TILE, py = y * TILE, o = pulse, l = 12;
  ctx.fillStyle = color;
  for (const [cx, cy, sx, sy] of [[px - o, py - o, 1, 1], [px + TILE + o, py - o, -1, 1], [px - o, py + TILE + o, 1, -1], [px + TILE + o, py + TILE + o, -1, -1]]) {
    ctx.fillRect(sx > 0 ? cx : cx - l, sy > 0 ? cy : cy - 3, l, 3);
    ctx.fillRect(sx > 0 ? cx : cx - 3, sy > 0 ? cy : cy - l, 3, l);
  }
}
function drawRange(range, moveColor, atkColor) {
  for (const k of range.move) tint(k, moveColor);
  for (const k of range.attack) if (!range.move.has(k)) tint(k, atkColor);
}
function drawPath(path) {
  if (path.length < 2) return;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, c] of [[10, 'rgba(20,30,60,0.5)'], [5, 'rgba(255,255,255,0.9)']]) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
    path.forEach((p, i) => { const cx = p.x * TILE + 24, cy = p.y * TILE + 24; i ? ctx.lineTo(cx, cy) : ctx.moveTo(cx, cy); });
    ctx.stroke();
  }
  const e = path[path.length - 1];
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(e.x * TILE + 24, e.y * TILE + 24, 6, 0, Math.PI * 2); ctx.fill();
}
function render(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (!state) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return; }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawTile(x, y, now);
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  for (let x = 1; x < COLS; x++) ctx.fillRect(x * TILE, 0, 1, H);
  for (let y = 1; y < ROWS; y++) ctx.fillRect(0, y * TILE, W, 1);

  const pulse = (Math.sin(now / 220) + 1) / 2;
  const lv = L(), goal = lv.gate || lv.throne;
  if (goal) { ctx.strokeStyle = `rgba(243,217,139,${0.45 + pulse * 0.5})`; ctx.lineWidth = 3; ctx.strokeRect(goal.x * TILE + 2.5, goal.y * TILE + 2.5, TILE - 5, TILE - 5); }

  if (ui.danger) {
    const dz = dangerZone();
    for (const k of dz) { tint(k, 'rgba(255,40,70,0.22)'); tint(k, HATCH); }
    outline(dz, 'rgba(255,90,110,0.95)');
  }
  if (ui.inspect) {
    if (!ui.inspect.alive) ui.inspect = null;
    else drawRange(computeRange(ui.inspect), 'rgba(80,140,255,0.4)', 'rgba(255,60,90,0.42)');
  }
  if (ui.mode === 'selected' && ui.range) {
    drawRange(ui.range, 'rgba(70,130,255,0.45)', 'rgba(255,60,90,0.42)');
    const h = ui.hover;
    if (h && ui.range.move.has(key(h.x, h.y))) drawPath(pathTo(ui.range.reach, h.x, h.y));
  }
  if (ui.mode === 'target' && ui.sel) {
    for (const k of attackSet(ui.sel, [ui.sel])) tint(k, 'rgba(255,60,90,0.25)');
    for (const t of ui.targets) tint(key(t.x, t.y), 'rgba(255,50,80,0.55)');
  }
  if (ui.sel && ui.mode !== 'idle') brackets(ui.sel.x, ui.sel.y, '#f3d98b', 0);

  const drawn = state.units.filter(u => u.alive || u.fade > 0).sort((a, b) => unitPos(a).y - unitPos(b).y);
  for (const u of drawn) drawUnit(u, now);

  if (ui.actor && ui.actor.alive) { const p = unitPos(ui.actor); ctx.strokeStyle = `rgba(255,120,120,${0.5 + pulse * 0.5})`; ctx.lineWidth = 3; ctx.strokeRect(p.x + 1.5, p.y + 1.5, TILE - 3, TILE - 3); }
  if (ui.mode === 'target' && ui.fcTarget) brackets(ui.fcTarget.x, ui.fcTarget.y, ui.pendingTarget === ui.fcTarget ? '#ffd24a' : '#ff8080', 2 + pulse * 2);
  else if (ui.hover && state.phase === 'player' && !ui.overlay) brackets(ui.hover.x, ui.hover.y, '#ffffff', 1 + pulse * 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ui.floats = ui.floats.filter(f => now - f.t0 < f.dur);
  for (const f of ui.floats) {
    const k = (now - f.t0) / f.dur;
    ctx.globalAlpha = 1 - k * k;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(f.text, f.x, f.y - k * 22); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - k * 22);
  }
  ctx.globalAlpha = 1;
  const b = ui.banner;
  if (b && b.dur > 0 && now < b.t0 + b.dur) {
    const k = (now - b.t0) / b.dur, a = Math.min(1, k * 6, (1 - k) * 6);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,12,20,0.8)'; ctx.fillRect(0, H / 2 - 30, W, 60);
    ctx.fillStyle = b.color; ctx.fillRect(0, H / 2 - 30, W, 2); ctx.fillRect(0, H / 2 + 28, W, 2);
    ctx.font = 'bold 30px Georgia, serif'; ctx.fillStyle = b.color;
    ctx.fillText(b.text, W / 2 + (1 - a) * 40, H / 2 + 1);
    ctx.globalAlpha = 1;
  }
}

// ---- side panel ----
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hpColor(r) { return r > 0.5 ? '#6fd67a' : r > 0.25 ? '#f0c43c' : '#ef5a4a'; }
const STANCE = {
  aggressive: 'Aggressive: hunts your units.',
  guard: 'Guard: holds position until you come within reach.',
  boss: 'Boss: never leaves the throne, strikes anything in reach.',
};
function unitCard(u) {
  const w = WEAPONS[u.weapon], t = terr(u.x, u.y), magic = w.type === 'tome';
  const atk = (magic ? u.mag : u.str) + w.mt, hit = w.hit + 2 * u.skl + Math.floor(u.lck / 2);
  const avo = 2 * u.spd + u.lck + t.avo, crit = w.crit + Math.floor(u.skl / 2);
  const rng = w.min === w.max ? w.min : `${w.min}–${w.max}`;
  const stat = (k, v) => `<span>${k}<b>${v}</b></span>`;
  return `<div class="sec stripe ${u.team}">
    <div class="uname">${esc(u.name)}<span class="cls">${u.name === u.cls ? 'Enemy' : u.cls}${u.lord ? ' · must survive' : ''}</span></div>
    <div class="hp"><span>HP</span><div class="bar"><i style="width:${100 * u.hp / u.maxHp}%;background:${hpColor(u.hp / u.maxHp)}"></i></div><b>${u.hp}/${u.maxHp}</b></div>
    <div class="small">${w.name} <span class="muted">· ${TYPE_LABEL[w.type]} · Mt ${w.mt} · Hit ${w.hit} · Crit ${w.crit} · Rng ${rng}</span></div>
    <div class="stats">${stat('Str', u.str)}${stat('Mag', u.mag)}${stat('Skl', u.skl)}${stat('Spd', u.spd)}${stat('Lck', u.lck)}${stat('Def', u.def)}${stat('Res', u.res)}${stat('Mov', u.mov)}</div>
    <div class="small muted">Atk ${atk} · Hit ${hit} · Avoid ${avo} · Crit ${crit}</div>
    <div class="small muted" style="margin-top:4px">${u.team === 'player' ? `Vulnerary ${u.vuln}/3${u.acted ? ' · has acted' : ''}` : STANCE[u.behavior]}</div>
  </div>`;
}
function forecastCard(fc) {
  const a = fc.attacker, d = fc.defender, A = fc.A, D = fc.D;
  const arrow = t => t > 0 ? ' <span class="adv">▲</span>' : t < 0 ? ' <span class="dis">▼</span>' : '';
  const cls = u => u.team === 'player' ? 'p' : 'e';
  const dmg = (s, can) => can ? `${s.dmg}${s.count === 2 ? ' ×2' : ''}` : '–';
  const row = (k, l, r) => `<tr><td>${l}</td><td class="k">${k}</td><td>${r}</td></tr>`;
  return `<div class="sec"><div class="label">Battle forecast</div>
    <table class="fc">
      <tr class="names"><td class="${cls(a)}">${esc(a.name)}</td><td></td><td class="${cls(d)}">${esc(d.name)}</td></tr>
      <tr class="wp"><td>${WEAPONS[a.weapon].name}${arrow(A.tri)}</td><td></td><td>${WEAPONS[d.weapon].name}${arrow(D.tri)}</td></tr>
      ${row('HP', `${a.hp} → <b>${fc.predicted.att}</b>`, `${d.hp} → <b>${fc.predicted.def}</b>`)}
      ${row('Dmg', dmg(A, true), dmg(D, D.canCounter))}
      ${row('Hit', A.hit, D.canCounter ? D.hit : '–')}
      ${row('Crit', A.crit, D.canCounter ? D.crit : '–')}
    </table>
    <div class="hint">${ui.pendingTarget === d ? 'Click again or press Enter to attack' : 'Click the target to lock in · Enter to attack'}</div>
  </div>`;
}
function terrainCard(x, y) {
  const t = terr(x, y), move = isFinite(t.cost) ? t.cost : '—';
  return `<div class="sec"><div class="label">Terrain (${x}, ${y})</div>
    <div><b>${t.name}</b> <span class="muted small">· Avoid +${t.avo} · Def +${t.def} · Move ${move}</span></div>
    ${t.note ? `<div class="small muted">${t.note}</div>` : ''}</div>`;
}
let lastPanel = '';
function updatePanel() {
  if (!state) return;
  const lv = L();
  const phaseLabel = { intro: 'Ready', player: 'Player Phase', enemy: 'Enemy Phase', over: 'Battle Over' }[state.phase];
  let h = `<div class="sec"><div class="chap">Chapter ${state.li + 1}</div><div class="lvname">${lv.name}</div>
    <div class="row"><span>Turn <b>${state.turn}</b>${lv.turns ? ` / ${lv.turns}` : ''}</span><span class="pill ${state.phase}">${phaseLabel}</span></div></div>
    <div class="sec"><div class="label">Objective</div>${lv.objective}<div class="small muted">Lose if: ${lv.lose}</div>
    <div class="small muted" style="margin-top:4px">Your army ${living('player').length} · Enemies ${living('enemy').length}</div></div>`;
  const hv = ui.hover, hu = hv ? unitAt(hv.x, hv.y) : null;
  if (ui.mode === 'target' && ui.fcTarget) h += forecastCard(forecast(ui.sel, ui.fcTarget));
  else if (hu || ui.sel || ui.inspect) h += unitCard(hu || ui.sel || ui.inspect);
  if (hv) h += terrainCard(hv.x, hv.y);
  h += `<div class="sec keys"><kbd>D</kbd> danger · <kbd>Z</kbd> undo · <kbd>E</kbd> end turn · <kbd>Esc</kbd> back · <kbd>Enter</kbd> attack</div>`;
  if (h !== lastPanel) { panelEl.innerHTML = h; lastPanel = h; }
}

function frame(now) {
  try { render(now); updatePanel(); updateToolbar(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

// =====================================================================
// 17. TEST / SCRIPTING HOOK
// =====================================================================
const asUnit = u => typeof u === 'string' ? unitById(u) : u;
window.game = {
  get state() { return state; },
  get ui() { return ui; },
  get roster() { return game.roster; },
  get log() { return game.log; },
  WEAPONS,
  threat: u => [...computeRange(asUnit(u)).attack],
  forecast: (a, d, x, y) => forecast(asUnit(a), asUnit(d), x, y),
  reachable: u => reachable(asUnit(u)).tiles,
  dangerZone: () => [...dangerZone()].map(k => ({ x: k % COLS, y: (k / COLS) | 0 })),
  trueHit: h => TRUE_HIT[h],
  roll2RN,
  setSpeed: s => { SPEED = s; },
  startLevel(li, { skipIntro = true } = {}) {
    if (skipIntro) { startLevel(li); hideOverlay(); return startPlayerPhase(); }
    showIntro(li);
  },
  // Scripted turn helpers used by the tests. They go through the same code paths as clicks.
  async act(id, x, y, action = 'wait', targetId = null) {
    if (inputBlocked()) throw new Error('Board is not accepting input');
    const u = asUnit(id);
    if (!u || !u.alive || u.acted || u.team !== 'player') throw new Error(`${id} cannot act`);
    toIdle(); selectUnit(u);
    if (!(await moveSelectedTo(x, y))) { cancel(); throw new Error(`${id} cannot reach (${x},${y})`); }
    if (action === 'attack') {
      const t = asUnit(targetId);
      await menuAction('attack');
      if (!ui.targets.includes(t)) { toIdle(); throw new Error(`${targetId} is not a valid target`); }
      await confirmAttack(t);
    } else {
      if (!menuItems(u).some(([k]) => k === action)) { toIdle(); throw new Error(`${action} not available`); }
      await menuAction(action);
    }
  },
  undo, endTurn: () => runEnemyPhase(), toggleDanger,
};

showTitle();
requestAnimationFrame(frame);
})();
</script>
